name: Erlang CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: lpgauth/erlang-scylla:28.3.1-6.2.3-amd64
    steps:
    - uses: actions/checkout@v4
    - name: Start Scylla
      run: |
        cat >> /etc/scylla/scylla.yaml <<EOF
        native_transport_port_ssl: 9142
        client_encryption_options:
            enabled: true
            certificate: $GITHUB_WORKSPACE/test/tls/node.crt
            keyfile: $GITHUB_WORKSPACE/test/tls/node.key
        EOF
        python3 /docker-entrypoint.py&
        sleep 60
    - name: Set Path
      run: |
        echo "/usr/local/lib/erlang/bin" >> $GITHUB_PATH
    - name: Compile
      run: make compile
    - name: Run xref
      run: make xref
    - name: Run eunit
      run: make eunit
      env:
        MARINA_TLS_CA: ${{ github.workspace }}/test/tls/ca.pem
    - name: Run dialyzer
      run: make dialyzer
